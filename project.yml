# XcodeGen 工程定义
#
# 说明：本文件是工程的唯一真实来源，.xcodeproj 由 CI 生成，不纳入版本控制。
# 在 Windows 上只需编辑本文件，无需（也无法）触碰 .xcodeproj。
# 本地生成命令（如有 Mac）：brew install xcodegen && xcodegen generate

name: Moments

options:
  # 部署目标定为 iOS 18.0，而不是 26.0。原因见 docs/设计文档.html 12.1：
  # CI runner 上可用的 Xcode 版本决定它能编译的最高 SDK；把部署目标定得
  # 比 runner 的 SDK 还高会直接构建失败。后续 M5/M6 引入 iOS 26 专属能力
  # （系统翻译框架的进阶用法、端侧系统语言模型）时，需要同步指定 Xcode 版本。
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 并发检查设为 minimal：本项目有实时音频线程 + 大量跨队列回调，
    # 先用最小约束把功能跑通，避免在还没验证功能时就被并发检查淹没。
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  # ---- 主 App ----
  # 注：会议模式的 Broadcast Upload Extension 是 M8 的目标，
  # 现在不建，避免过早引入一个无法验证的空扩展（见设计文档 13 章）。
  Moments:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 资源目录：目前只有内置的 sherpa 模型（CI 下载后随包打包）。
      # 排除 Info.plist —— 它由 INFOPLIST_FILE 单独引用，
      # 若再被当作普通资源拷进包内会产生重复与告警。
      # 注意资源会被**平铺到包根目录**，因此代码里可以直接用
      # Bundle.main.bundleURL.appendingPathComponent(fileName) 定位（见 SherpaBundledModel）。
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    dependencies:
      # ═══ whisper.cpp（M2 转写引擎）═══
      # 官方已移除 SwiftPM 支持，因此由 CI 用官方 build-xcframework.sh
      # 构建成【静态】xcframework 后在此链接。third_party/ 不入版本控制。
      # 静态而非动态的理由：免去签名与嵌入步骤，对未签名构建更省事。
      - framework: third_party/whisper.cpp/build-apple/whisper.xcframework
        embed: false
      # ggml（whisper 的底层张量库）依赖这些系统框架：BLAS 走 Accelerate，GPU 走 Metal
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      # ═══ CoreML（由 CI 实测补入，不是猜的）═══
      # whisper.cpp 的静态库里包含 CoreML 编码器路径的目标文件
      # （whisper-encoder.o / whisper-encoder-impl.o，源自 whisper-encoder.mm），
      # 它们引用了 Objective-C 类 MLMultiArray 与 MLPredictionOptions。
      # 即便我们不使用 CoreML 编码器，这些目标文件也已经在库里，
      # 链接时必须能解析到符号，否则报：
      #   Undefined symbols for architecture arm64:
      #     "_OBJC_CLASS_$_MLMultiArray", referenced from whisper-encoder.o
      #   ld: symbol(s) not found for architecture arm64
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_NAME: Moments
        # 显示名在中文字符串里（Info.plist 的 CFBundleDisplayName = 时刻），
        # Bundle ID 必须是纯 ASCII，这是 Apple 的硬要求。
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.moments
        # 沿用既有项目的开发者账号（Team ID 属账号级信息）。
        # 当前走未签名构建，此项不参与签名；接入 Ad Hoc 时才会用到。
        DEVELOPMENT_TEAM: "S2GX2R7LD5"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # 桥接头：把两个第三方 C 库（whisper.cpp、sherpa-onnx）暴露给 Swift。
        # 注意 Xcode 只能指定**一个**桥接头，因此收口到 Bridges.h，
        # 由它分别 include WhisperBridge.h 与 SherpaBridge.h。
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/Bridges.h
        # ggml 与 sherpa-onnx 都是 C++ 实现，需要 C++ 标准库；
        # -lz 是 onnxruntime 静态库的常见依赖；
        # -lsherpa-onnx-all 是 CI 合并出的「sherpa-onnx + onnxruntime」单一静态库。
        # -lsqlite3：M4 的存储与检索用系统 SQLite（含 FTS5 全文索引）。
        # 刻意**不引入第三方封装**（GRDB / SQLite.swift）：本项目已有两个
        # 手工构建的二进制依赖，再多一个来源不同的依赖，只会增加"哪一层坏了"的排查成本。
        # 系统 SQLite 的 C API 写起来啰嗦一点，但确定可用、零版本风险。
        OTHER_LDFLAGS: "-lc++ -lz -lsherpa-onnx-all -lsqlite3"
        # ═══ sherpa-onnx（M3）═══
        # 刻意**不走 xcframework**：本项目的 iOS 产物只用于真机侧载，
        # 只需要真机切片；直接链接 CI 合并出的 .a + 头文件目录，
        # 比走 framework bundle 少一层"切片选择 / Info.plist / modulemap"的坑。
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/third_party/sherpa-onnx/build-ios-os64/build/os64"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/third_party/sherpa-onnx/build-ios-os64/install/include"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

# 必须显式声明 scheme，否则 CI 中的 xcodebuild -scheme 找不到共享 scheme
schemes:
  Moments:
    build:
      targets:
        Moments: all
    run:
      config: Debug
    archive:
      config: Release
