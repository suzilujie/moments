# XcodeGen 工程定义
#
# 说明：本文件是工程的唯一真实来源，.xcodeproj 由 CI 生成，不纳入版本控制。
# 在 Windows 上只需编辑本文件，无需（也无法）触碰 .xcodeproj。
# 本地生成命令（如有 Mac）：brew install xcodegen && xcodegen generate

name: Moments

options:
  # 部署目标定为 iOS 18.0，而不是 26.0。原因见 docs/设计文档.html 12.1：
  # CI runner 上可用的 Xcode 版本决定它能编译的最高 SDK；把部署目标定得
  # 比 runner 的 SDK 还高会直接构建失败。后续 M5/M6 引入 iOS 26 专属能力
  # （系统翻译框架的进阶用法、端侧系统语言模型）时，需要同步指定 Xcode 版本。
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 并发检查设为 minimal：本项目有实时音频线程 + 大量跨队列回调，
    # 先用最小约束把功能跑通，避免在还没验证功能时就被并发检查淹没。
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  # ---- 主 App ----
  Moments:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 资源目录：内置的 sherpa 模型（VAD / 降噪）与 SenseVoice tokens（CI 下载后随包打包）。
      # 排除 Info.plist —— 它由 INFOPLIST_FILE 单独引用，
      # 若再被当作普通资源拷进包内会产生重复与告警。
      # 注意资源会被**平铺到包根目录**，因此代码里可以直接用
      # Bundle.main.bundleURL.appendingPathComponent(fileName) 定位（见 SherpaBundledModel）。
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      # ═══ 广播扩展（R23 探针，临时）═══
      # 会议模式（系统内录）的 Broadcast Upload Extension。当前仅用于 R23 探针：
      # 验证"广播运行期间主 App 能否继续采麦克风"（互斥）与"扩展能拿到什么格式"。
      # embed: true 让 Xcode 把 .appex 嵌入主 App 的 PlugIns/ 目录。
      # 探针结束若不做会议模式，删除此依赖与 BroadcastExtension/ 目录即可。
      - target: MomentsBroadcastExtension
        embed: true
      # RPSystemBroadcastPickerView（主 App 弹出系统录制入口）来自 ReplayKit
      - sdk: ReplayKit.framework
      # ═══ 系统翻译框架（M5）═══
      # 端侧翻译、免费、零模型体积，语言包由系统管理。
      # 显式声明而不依赖自动链接：本项目已经因为漏了 CoreML 而失败过一次
      # （whisper 静态库里含 CoreML 目标文件），系统框架宁可写全。
      - sdk: Translation.framework
      # ═══ Network（首次使用自动准备模型：区分 Wi-Fi 与移动网络）═══
      # 用于判断当前是否"不计流量"（NWPathMonitor），决定要不要静默下载 226 MB 的模型。
      # 与 Translation.framework 同理**显式声明**：漏链接的失败形态是链接错误，
      # 不带行列号，在无 Xcode 的环境里极难定位。
      - sdk: Network.framework
    settings:
      base:
        PRODUCT_NAME: Moments
        # 显示名在中文字符串里（Info.plist 的 CFBundleDisplayName = 时刻），
        # Bundle ID 必须是纯 ASCII，这是 Apple 的硬要求。
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.moments
        # 沿用既有项目的开发者账号（Team ID 属账号级信息）。
        # 当前走未签名构建，此项不参与签名；接入 Ad Hoc 时才会用到。
        DEVELOPMENT_TEAM: "S2GX2R7LD5"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # R23 探针：主 App 与广播扩展共享 App Group（读扩展写出的统计）。
        # 未签名构建下 entitlement 不参与签名，由 Sideloadly 侧载时注入；
        # 若侧载不支持 App Group，探针自动降级为只看"麦克风计数"（仍可判互斥）。
        CODE_SIGN_ENTITLEMENTS: Resources/Moments.entitlements
        # 桥接头：把 sherpa-onnx（SenseVoice 识别 + VAD + 降噪）的 C API 暴露给 Swift。
        # 注意 Xcode 只能指定**一个**桥接头，因此收口到 Bridges.h。
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/Bridges.h
        # sherpa-onnx 是 C++ 实现，需要 C++ 标准库；
        # -lz 是 onnxruntime 静态库的常见依赖；
        # -lsherpa-onnx-all 是 CI 合并出的「sherpa-onnx + onnxruntime」单一静态库。
        # -lsqlite3：M4 的存储与检索用系统 SQLite（含 FTS5 全文索引）。
        # 刻意**不引入第三方封装**（GRDB / SQLite.swift）：本项目已有两个
        # 手工构建的二进制依赖，再多一个来源不同的依赖，只会增加"哪一层坏了"的排查成本。
        # 系统 SQLite 的 C API 写起来啰嗦一点，但确定可用、零版本风险。
        OTHER_LDFLAGS: "-lc++ -lz -lsherpa-onnx-all -lsqlite3"
        # ═══ sherpa-onnx（M3）═══
        # 刻意**不走 xcframework**：本项目的 iOS 产物只用于真机侧载，
        # 只需要真机切片；直接链接 CI 合并出的 .a + 头文件目录，
        # 比走 framework bundle 少一层"切片选择 / Info.plist / modulemap"的坑。
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/third_party/sherpa-onnx/build-ios-os64/build/os64"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/third_party/sherpa-onnx/build-ios-os64/install/include"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # ── 图标（P29，2026-09-24 接入）──
        # 资源目录里只放一张 1024（单一尺寸，其余尺寸由 Xcode 生成）。
        # CI 的 verify 会断言 Assets.car 与 CFBundleIconName 真的进了包 ——
        # 那一步不是可选项：资源目录里缺图标时构建**不会失败**，
        # 只会静默地没有图标，装到手机上表现为"还是默认白图标"。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---- 广播扩展（R23 探针，临时）----
  # 会议模式（系统内录）的 Broadcast Upload Extension。
  # 当前仅承载 R23 探针：只统计 audioApp/audioMic 的 buffer 与格式、写入 App Group，
  # **不做任何音频搬运、不落盘、不跑推理**（扩展内存几十 MB，见设计文档 4.6 约束二）。
  MomentsBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      # RPBroadcastSampleHandler 来自 ReplayKit
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_NAME: MomentsBroadcastExtension
        # 扩展的 Bundle ID 必须是主 App 的子域，这是 Apple 的硬要求
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.moments.Broadcast
        DEVELOPMENT_TEAM: "S2GX2R7LD5"
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/MomentsBroadcastExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

# 必须显式声明 scheme，否则 CI 中的 xcodebuild -scheme 找不到共享 scheme
schemes:
  Moments:
    build:
      targets:
        Moments: all
        MomentsBroadcastExtension: all
    run:
      config: Debug
    archive:
      config: Release
