name: ios-build

# 无 Mac 开发链路：在 GitHub 托管的 macOS runner 上构建【未签名 ipa】，
# 下载后由 Windows 侧的 Sideloadly 侧载到 iPhone。
#
# 分发方式（2026-09-22 决策，见 docs/设计文档.html 12.1）：
#   M0–M1 阶段只走这条「未签名 ipa + USB 侧载」路径，不接 Ad Hoc，
#   因此不需要 App Store Connect 的任何配置，也不需要在仓库里配 Secrets。
#   付费账号下侧载的描述文件有效期为 1 年（非免费账号的 7 天），不存在每周重签问题。
#   Ad Hoc 作为后续可随时切换的升级路径保留：届时新增一条工作流即可，App 代码不用动。
#
# 关于 Xcode / SDK 版本：
#   部署目标定为 iOS 18.0，而不是 26.0。原因是 runner 上默认可用的 Xcode 决定了
#   它能编译的最高 SDK，部署目标高于 SDK 会直接构建失败。
#   后续 M5/M6 引入 iOS 26 专属能力时，需要在本文件显式指定 Xcode 版本
#   （或改用更新的 macOS runner）。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned ipa
    runs-on: macos-15
    # 120 分钟：两个 C/C++ 大依赖（whisper.cpp、sherpa-onnx）的**首次**构建
    # 各自都需要数分钟到十几分钟；命中缓存后才会回落到几分钟。
    # 原为 60 分钟，M3 加入 sherpa-onnx 后上调。
    timeout-minutes: 120

    env:
      # whisper.cpp 固定 tag（官方已移除 SwiftPM 支持，只能自建 xcframework）
      WHISPER_TAG: v1.9.4
      # sherpa-onnx 固定 tag。
      # 注意：其 release 里只有 Android / Windows / macOS / WASM 产物，
      # **没有 iOS**，官方只提供构建脚本，因此必须自建（M3）。
      SHERPA_TAG: v1.13.8
      # sherpa-onnx 依赖的 onnxruntime iOS 静态库版本（官方脚本里的默认值）
      ORT_VERSION: 1.28.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # ═══════════════════════════════════════════════════════════════
      # whisper.cpp → xcframework
      #
      # 为什么要在 CI 里自己构建：whisper.cpp 官方已经移除了 SwiftPM 支持
      # （仓库根目录没有 Package.swift 了），第三方封装 SwiftWhisper 也已停更。
      # 官方唯一支持的集成方式是 build-xcframework.sh，它会把 ggml 与 Metal
      # 着色器一并处理，产出可直接链接的 xcframework（本项目用静态形式，
      # 免去签名与嵌入步骤）。
      #
      # 缓存整个 third_party/whisper.cpp（源码 + 产物）：key 绑定 tag，
      # 这样日常改动不会重复编译 C++，只有升级 whisper 版本时才重编。
      # ═══════════════════════════════════════════════════════════════
      - name: Cache whisper.cpp (source + xcframework)
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: third_party/whisper.cpp
          key: whisper-${{ env.WHISPER_TAG }}-${{ runner.os }}

      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p third_party
          if [ ! -d third_party/whisper.cpp/.git ]; then
            git clone --depth 1 --branch "${WHISPER_TAG}" \
              https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp
          fi
          cd third_party/whisper.cpp
          # 静态 xcframework：不产生动态库，链接进 App，无需签名与嵌入
          BUILD_STATIC_XCFRAMEWORK=ON ./build-xcframework.sh
          echo "=== 构建完成，产物 ==="
          ls -la build-apple || true

      # 产物结构诊断：本机是 Windows、无法预先查看 xcframework 内部布局，
      # 因此把关键路径以【注解】形式输出 —— 注解可匿名读取，而 Actions 原始
      # 日志需要认证（403）。这样即使链接配置写错，也能立刻看到真实结构。
      - name: Report whisper artifact layout
        if: always()
        run: |
          if [ -d third_party/whisper.cpp/build-apple ]; then
            echo "::notice::whisper 产物目录已生成"
            find third_party/whisper.cpp/build-apple -maxdepth 2 -name "*.xcframework" | head -10 | while IFS= read -r p; do
              echo "::warning::whisper-xcframework ${p}"
            done
            find third_party/whisper.cpp/build-apple -maxdepth 4 -name "whisper.h" | head -10 | while IFS= read -r p; do
              echo "::warning::whisper-header ${p}"
            done
            find third_party/whisper.cpp/build-apple -maxdepth 4 -name "module.modulemap" | head -5 | while IFS= read -r p; do
              echo "::warning::whisper-modulemap ${p}"
            done
          else
            echo "::warning::third_party/whisper.cpp/build-apple 不存在，xcframework 未生成"
          fi

      # ═══════════════════════════════════════════════════════════════
      # sherpa-onnx（M3）→ 合并静态库
      #
      # 与官方 build-ios-no-tts.sh 的三点差异（都是刻意的）：
      #  1) **只构建真机切片（PLATFORM=OS64）**。官方脚本还会构建
      #     SIMULATOR64 与 SIMULATORARM64 两个模拟器切片，而本项目产物
      #     只用于真机侧载，模拟器切片纯属浪费、会让 CI 时间成倍增加。
      #  2) **把 sherpa-onnx 与 onnxruntime 合并成一个 .a**。两者都是静态库；
      #     合并后 Xcode 侧只需 `-l` 一个库名，省掉 framework bundle、
      #     切片选择，以及 onnxruntime 产物无 lib 前缀（-l 找不到）的麻烦。
      #  3) **toolchain 用绝对路径**。官方脚本写的是
      #     `-DCMAKE_TOOLCHAIN_FILE=./toolchains/ios.toolchain.cmake`，
      #     而它当时的工作目录是 build-ios-no-tts/，相对基准有歧义；
      #     这里直接给绝对路径，不给"路径对不对"留任何余地。
      #
      # 缓存整个 third_party/sherpa-onnx（源码 + 产物），key 绑定 tag 与
      # onnxruntime 版本：日常改动不重编 C++，只有升级版本时才重编。
      # ═══════════════════════════════════════════════════════════════
      - name: Cache sherpa-onnx (source + built lib)
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: third_party/sherpa-onnx
          key: sherpa-${{ env.SHERPA_TAG }}-ort${{ env.ORT_VERSION }}-${{ runner.os }}

      - name: Build sherpa-onnx static lib (device only)
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          if [ ! -d third_party/sherpa-onnx/.git ]; then
            git clone --depth 1 --branch "${SHERPA_TAG}" \
              https://github.com/k2-fsa/sherpa-onnx third_party/sherpa-onnx \
              || { echo "::error::克隆 sherpa-onnx 失败（tag ${SHERPA_TAG}）"; exit 1; }
          fi

          cd third_party/sherpa-onnx
          SRC_ROOT="$PWD"
          mkdir -p build-ios-os64
          cd build-ios-os64
          LOGS="$PWD/logs"
          mkdir -p "$LOGS"

          # 分阶段落日志，失败时把尾部转成注解。
          # 理由与 M2 相同：Actions 原始日志需认证（403），本机读不到，
          # **注解是唯一观测通道**。没有它就只能靠猜，而一轮 CI 成本很高。
          emit_fail() {
            name="$1"
            echo "::error::阶段「${name}」失败，日志尾部如下"
            tail -25 "$LOGS/${name}.log" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | cut -c1-280)"
            done
            exit 1
          }

          echo "=== 1/5 下载 onnxruntime iOS 静态库 ==="
          ORT_DIR="$PWD/ios-onnxruntime/${ORT_VERSION}"
          if [ ! -d "$ORT_DIR/onnxruntime.xcframework" ]; then
            mkdir -p "$ORT_DIR"
            (
              cd "$ORT_DIR"
              # 官方脚本用的是 wget -c，但 macOS runner 不保证装有 wget，改用 curl
              curl -fL --retry 3 -o ort.zip \
                "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v${ORT_VERSION}/onnxruntime-ios-static-xcframework-${ORT_VERSION}.xcframework.zip"
              unzip -q ort.zip
              rm -f ort.zip
            ) > "$LOGS/01-download-ort.log" 2>&1 || emit_fail "01-download-ort"
          fi

          # ⚠️ 官方脚本的两个环境变量口径**不一致**，极易写错：
          #   · SHERPA_ONNXRUNTIME_LIB_DIR  = onnxruntime.framework 的**父目录**
          #   · SHERPA_ONNXRUNTIME_INCLUDE_DIR = .../onnxruntime.framework/Headers
          # 第一次实现就是因为把 LIB_DIR 也写到了 framework 内部而导致构建失败。
          ORT_SLICE="$ORT_DIR/onnxruntime.xcframework/ios-arm64"
          export SHERPA_ONNXRUNTIME_LIB_DIR="$ORT_SLICE"
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR="$ORT_SLICE/onnxruntime.framework/Headers"
          ls -la "$ORT_SLICE" || true

          echo "=== 2/5 配置（仅真机 OS64）==="
          cmake \
            -DSHERPA_ONNX_ENABLE_TTS=OFF \
            -DBUILD_PIPER_PHONMIZE_EXE=OFF \
            -DBUILD_PIPER_PHONMIZE_TESTS=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DBUILD_ESPEAK_NG_TESTS=OFF \
            -S "$SRC_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$SRC_ROOT/toolchains/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DENABLE_BITCODE=0 \
            -DENABLE_ARC=1 \
            -DENABLE_VISIBILITY=0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_JNI=OFF \
            -DSHERPA_ONNX_ENABLE_C_API=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DDEPLOYMENT_TARGET=13.0 \
            -B build/os64 > "$LOGS/02-cmake-configure.log" 2>&1 || emit_fail "02-cmake-configure"
          echo "配置完成"

          echo "=== 3/5 编译 ==="
          cmake --build build/os64 -j 4 > "$LOGS/03-cmake-build.log" 2>&1 || emit_fail "03-cmake-build"
          echo "编译完成"

          echo "=== 4/5 安装头文件 ==="
          cmake --build build/os64 --target install > "$LOGS/04-cmake-install.log" 2>&1 || emit_fail "04-cmake-install"
          ls -la install/include/sherpa-onnx/c-api/ || true

          echo "=== 5/5 合并静态库（sherpa-onnx + onnxruntime）==="
          libtool -static -o build/os64/libsherpa-onnx-all.a \
            build/os64/lib/libkaldi-native-fbank-core.a \
            build/os64/lib/libkissfft-float.a \
            build/os64/lib/libsherpa-onnx-c-api.a \
            build/os64/lib/libsherpa-onnx-core.a \
            build/os64/lib/libsherpa-onnx-fst.a \
            build/os64/lib/libsherpa-onnx-fstfar.a \
            build/os64/lib/libsherpa-onnx-kaldifst-core.a \
            build/os64/lib/libkaldi-decoder-core.a \
            build/os64/lib/libssentencepiece_core.a \
            "$ORT_SLICE/onnxruntime.framework/onnxruntime" \
            > "$LOGS/05-libtool-merge.log" 2>&1 || emit_fail "05-libtool-merge"
          ls -lh build/os64/libsherpa-onnx-all.a

      # 与 whisper 同样的理由（见下）：本机看不到 Actions 原始日志，
      # 注解是唯一观测通道。这里把三个关键产物路径直接报出来 ——
      # 链接失败时，"路径到底存不存在"是第一个要排除的可能。
      - name: Report sherpa-onnx artifact layout
        if: always()
        run: |
          BASE=third_party/sherpa-onnx/build-ios-os64
          if [ -d "$BASE" ]; then
            echo "::notice::sherpa-onnx 构建目录已生成"
            echo "::warning::sherpa-lib $(ls -1 "$BASE/build/os64/libsherpa-onnx-all.a" 2>/dev/null || echo '缺失 libsherpa-onnx-all.a')"
            echo "::warning::sherpa-header $(ls -1 "$BASE/install/include/sherpa-onnx/c-api/c-api.h" 2>/dev/null || echo '缺失 c-api.h')"
            echo "::warning::sherpa-ort $(ls -1 "$BASE/ios-onnxruntime/${ORT_VERSION}/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime" 2>/dev/null || echo '缺失 onnxruntime')"
          else
            echo "::warning::$BASE 不存在，sherpa-onnx 未构建"
          fi

      # ═══════════════════════════════════════════════════════════════
      # sherpa-onnx 模型 —— **内置随包**，不做运行时下载
      #
      # 与 whisper 模型刻意做成相反的两种策略，判据是「体积 + 可靠性」：
      #   · 这四个模型合计约 35 MB，远低于蜂窝下载 200 MB 的上限；
      #   · 它们的原始托管在 GitHub Releases，而交付环境实测 github.com
      #     不可达（见工作日志阶段十一、十四）。若做成运行时下载，
      #     「降噪 / VAD / 说话人分离」就会在用户手上直接不可用 ——
      #     那是把一个可用的功能做成不可用。
      # 内置之后，M3 的全部能力永久可用、不依赖任何网络。
      #
      # 注意 tag 名 speaker-recongition-models 里的拼写错误是上游原样，
      # 不是本项目的笔误 —— 改成正确拼写反而会 404。
      # ═══════════════════════════════════════════════════════════════
      - name: Fetch sherpa-onnx models (bundled into ipa)
        run: |
          DEST=Resources/SherpaModels
          mkdir -p "$DEST"
          BASE="https://github.com/k2-fsa/sherpa-onnx/releases/download"

          fetch() {
            name="$1"; url="$2"
            if [ -f "$DEST/$name" ]; then
              echo "已存在 $name，跳过"
              return 0
            fi
            echo "下载 $name"
            curl -fL --retry 3 -o "$DEST/$name" "$url" \
              || { echo "::error::下载 $name 失败：$url"; exit 1; }
          }

          fetch silero_vad.onnx "$BASE/asr-models/silero_vad.onnx"
          fetch gtcrn_simple.onnx "$BASE/speech-enhancement-models/gtcrn_simple.onnx"
          fetch campplus_zh_en_16k.onnx \
            "$BASE/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"

          # pyannote 分割模型是 tar.bz2 包，解出其中的 model.onnx 并改名
          if [ ! -f "$DEST/pyannote_segmentation_3_0.onnx" ]; then
            curl -fL --retry 3 -o /tmp/seg.tar.bz2 \
              "$BASE/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" \
              || { echo "::error::下载 pyannote 分割模型失败"; exit 1; }
            tar -xjf /tmp/seg.tar.bz2 -C /tmp
            cp /tmp/sherpa-onnx-pyannote-segmentation-3-0/model.onnx \
               "$DEST/pyannote_segmentation_3_0.onnx" \
              || { echo "::error::解包 pyannote 分割模型失败"; exit 1; }
          fi

          echo "=== 内置模型清单 ==="
          ls -lh "$DEST"
          for f in silero_vad.onnx gtcrn_simple.onnx pyannote_segmentation_3_0.onnx campplus_zh_en_16k.onnx; do
            if [ -f "$DEST/$f" ]; then
              echo "::notice::bundled-model $f $(stat -f%z "$DEST/$f") bytes"
            else
              echo "::error::bundled-model 缺失 $f"
            fi
          done

      # ═══════════════════════════════════════════════════════════════
      # 英语词频表（M6 生词判定）—— 同样内置随包
      #
      # 为什么内置：它就是"生词判定"的判据本身，必须**固定不变**。
      # 若做成联网获取，词表会随上游更新而变 —— 同一句话昨天不是生词、
      # 今天变成生词，复习计划就毁了。74 KB，没有任何理由做成下载。
      #
      # 行数下限校验是刻意加的：词表被截断/换源时若静默通过，
      # 后果是**大面积误判**（几乎所有词都成了"词表之外"的生词），
      # 而这类错误在真机上看起来只是"标得有点多"，很难追查。
      # ═══════════════════════════════════════════════════════════════
      - name: Fetch word frequency list (bundled into ipa)
        run: |
          DEST=Resources/WordLists
          mkdir -p "$DEST"
          if [ ! -f "$DEST/en_top10k.txt" ]; then
            curl -fL --retry 3 -o "$DEST/en_top10k.txt" \
              "https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-usa.txt" \
              || { echo "::error::下载英语词频表失败"; exit 1; }
          fi
          LINES=$(wc -l < "$DEST/en_top10k.txt" | tr -d ' ')
          echo "词频表行数 = $LINES"
          if [ "$LINES" -lt 5000 ]; then
            echo "::error::词频表行数异常（$LINES 行），生词判定会大面积误判"
            exit 1
          fi
          echo "::notice::wordlist en_top10k.txt $LINES 行 $(stat -f%z "$DEST/en_top10k.txt") bytes"

      - name: Generate Xcode project
        run: xcodegen generate

      # 注入构建指纹：把本次提交号与构建时间写进 App 界面，
      # 避免"设备上装的到底是哪一版"这个高频误判点。
      - name: Inject build info
        run: |
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo 'import Foundation'
            echo ''
            echo 'enum BuildInfo {'
            echo "    static let commit = \"$SHA\""
            echo "    static let builtAt = \"$BUILT_AT\""
            echo '}'
          } > Sources/App/BuildInfo.swift
          cat Sources/App/BuildInfo.swift

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Moments.xcodeproj \
            -scheme Moments \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
          echo "build.log lines: $(wc -l < build.log)"

      # 把编译诊断转成 GitHub【注解】（annotations）。
      #
      # 为什么需要这一步：Actions 的原始日志需要认证才能下载，匿名访问会返回 403，
      # 因此"看不到日志 = 无法定位编译错误"。而 check-runs 接口对公开仓库可匿名读取，
      # 注解正是挂在 check-run 上的 —— 把错误转成注解，就能在没有登录凭据的情况下
      # 读到具体是哪个文件、哪一行、什么错误。
      #
      # 同时把完整日志作为 artifact 上传，供人工排查（CI 报错时最容易做的事是搜索）。
      - name: Report diagnostics as annotations
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "::warning::未捕获到 build.log（构建步骤可能未执行）"
            exit 0
          fi

          echo "=== 错误行预览 ==="
          grep -E 'error:' build.log | head -40 || true

          grep -E ':[0-9]+:[0-9]+: error:' build.log | head -40 > errors.txt || true
          grep -E ':[0-9]+:[0-9]+: warning:' build.log | head -15 > warnings.txt || true

          emit() {
            level="$1"
            file="$2"
            while IFS= read -r line; do
              pathpart=$(printf '%s' "$line" | cut -d: -f1)
              lineno=$(printf '%s' "$line" | cut -d: -f2)
              colno=$(printf '%s' "$line" | cut -d: -f3)
              msg=$(printf '%s' "$line" | sed -E "s/^[^:]*:[0-9]+:[0-9]+: ${level}: //")
              rel=$(printf '%s' "$pathpart" | sed -E 's#^.*/moments/##')
              echo "::${level} file=${rel},line=${lineno},col=${colno}::${msg}"
            done < "$file"
          }

          if [ -s errors.txt ]; then
            echo "=== 共 $(wc -l < errors.txt) 条编译错误，已转为注解 ==="
            emit "error" errors.txt
          elif [ -s warnings.txt ]; then
            echo "=== 无编译错误，$(wc -l < warnings.txt) 条警告已转为注解 ==="
            emit "warning" warnings.txt
          else
            echo "无编译诊断"
          fi

          # ── 补充通道：不带「行:列」的错误 ──
          #
          # 上面的正则只抓 `文件:行:列: error:` 这一种格式。但构建失败最常见的形态是
          # 【链接错误】，它长这样：
          #   ld: Undefined symbols: _whisper_init_from_file_with_params
          #   ld: framework 'whisper' not found
          #   error: Build input file cannot be found: .../whisper.xcframework
          #   clang: error: linker command failed with exit code 1
          # 全都不带行列号 —— 于是"构建失败却一条错误注解都没有"。
          # 本机是 Windows、看不到 Actions 原始日志（需认证），注解是唯一观测通道，
          # 因此这里必须把这类错误也捞出来。
          echo "=== 非定位型错误 ==="
          grep -E 'error:|ld:|Undefined symbol|framework not found|Build input file cannot be found|Command .* failed|unable to|No such file' build.log \
            | grep -v -E ':[0-9]+:[0-9]+: (warning|error):' \
            | tail -25 > raw.txt || true
          grep -E 'error:|ld:|Undefined symbol|framework not found|Build input file cannot be found|Command .* failed|unable to|No such file' build.log \
            | grep -v -E ':[0-9]+:[0-9]+: (warning|error):' \
            | tail -25 || true
          while IFS= read -r line; do
            short=$(printf '%s' "$line" | cut -c1-280)
            echo "::error::${short}"
          done < raw.txt

          # 日志尾部：链接失败时结论往往只在最后几行，而它们通常不含 "error:"
          echo "=== 日志尾部 ==="
          tail -15 build.log | while IFS= read -r line; do
            short=$(printf '%s' "$line" | cut -c1-280)
            echo "::warning title=build-tail::${short}"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moments-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/Moments.app Payload/
          echo "=== .app 内文件明细 ==="
          find Payload -type f -exec ls -l {} \;
          zip -qr Moments-unsigned.ipa Payload
          ls -lh Moments-unsigned.ipa

      # 产物自检：CI 报成功不等于 ipa 可安装。
      # 这里校验的每一项都对应设计文档里一条"必须在设备上成立的前提"：
      #   · 可执行文件 → 产物是不是真的 App
      #   · arm64 Mach-O → 能不能在真机跑
      #   · Bundle ID 已展开 → 有没有把构建变量漏进产物
      #   · UIBackgroundModes[0]=audio → 锁屏能否继续录音（设计文档 3.2）
      #   · NSMicrophoneUsageDescription → 麦克风权限弹窗能否出现（设计文档 4.14）
      # 任一不满足即构建失败（fail-fast），避免"能编译但不能用"的坏产物流到侧载环节。
      - name: Verify ipa contents
        run: |
          set -e
          rm -rf verify && mkdir verify
          unzip -q Moments-unsigned.ipa -d verify

          echo "=== ipa 解包清单 ==="
          find verify -type f -exec ls -l {} \;

          APP_BIN="verify/Payload/Moments.app/Moments"
          if [ ! -f "$APP_BIN" ]; then
            echo "::error::ipa 中缺少可执行文件: $APP_BIN"
            exit 1
          fi

          # 关键判据用 file 的类型判定，而不是体积阈值：
          # 极小的 App 二进制可能只有几十 KB，体积阈值容易误报。
          FILE_INFO=$(file "$APP_BIN")
          echo "file = $FILE_INFO"
          echo "executable size = $(stat -f%z "$APP_BIN") bytes"
          case "$FILE_INFO" in
            *Mach-O*arm64*) ;;
            *)
              echo "::error::可执行文件不是 arm64 Mach-O 产物，构建产物异常"
              exit 1
              ;;
          esac

          PLIST="verify/Payload/Moments.app/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::ipa 中缺少 Info.plist"
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          echo "CFBundleIdentifier = $BUNDLE_ID"
          case "$BUNDLE_ID" in
            com.xfish.moments) ;;
            *) echo "::error::Bundle ID 不是预期的 com.xfish.moments，实际为 '$BUNDLE_ID'"; exit 1 ;;
          esac

          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          echo "CFBundleDisplayName = $DISPLAY_NAME"

          # 锁屏继续录音的硬前提（设计文档 3.2）
          BG=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST" 2>/dev/null || true)
          echo "UIBackgroundModes[0] = $BG"
          if [ "$BG" != "audio" ]; then
            echo "::error::UIBackgroundModes[0] 应为 audio（锁屏录音前提），实际为 '$BG'"
            exit 1
          fi

          # 麦克风权限弹窗的硬前提（设计文档 4.14）
          MIC=$(/usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST" 2>/dev/null || true)
          if [ -z "$MIC" ]; then
            echo "::error::缺少 NSMicrophoneUsageDescription，麦克风权限弹窗不会出现"
            exit 1
          fi
          echo "NSMicrophoneUsageDescription 已配置 (${#MIC} 字符)"

          # 反向校验：本项目不使用 Apple 语音识别框架，
          # 不应出现该权限声明（保持最小权限面，见设计文档 4.14）
          if /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$PLIST" >/dev/null 2>&1; then
            echo "::warning::产物中存在 NSSpeechRecognitionUsageDescription —— 本项目不使用该框架，应移除"
          fi

          # M3 内置模型必须真的进了包。
          # 否则 VAD / 降噪 / 说话人分离会在设备上**静默降级**到 M2 的行为
          # （代码里刻意做了失败降级），而用户完全不知道为什么 ——
          # 这种"功能没生效但不报错"的情况，必须在这一步拦住。
          APP_DIR="verify/Payload/Moments.app"
          for f in silero_vad.onnx gtcrn_simple.onnx pyannote_segmentation_3_0.onnx campplus_zh_en_16k.onnx; do
            if [ ! -f "$APP_DIR/$f" ]; then
              echo "::error::内置模型未打进包：$f"
              exit 1
            fi
            echo "内置模型已打包 $f ($(stat -f%z "$APP_DIR/$f") bytes)"
          done

          # M6 词频表同理：它是生词判定的判据，缺了会让该功能静默失效
          if [ ! -f "$APP_DIR/en_top10k.txt" ]; then
            echo "::error::词频表未打进包：en_top10k.txt"
            exit 1
          fi
          echo "词频表已打包 en_top10k.txt ($(stat -f%z "$APP_DIR/en_top10k.txt") bytes)"

          echo "verify passed"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moments-unsigned-ipa
          path: Moments-unsigned.ipa
          retention-days: 30
